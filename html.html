// أسماء التصنيفات

const categoryNames = {
    structure: "البنية الأساسية",
    text: "النصوص",
    media: "الوسائط",
    lists: "القوائم",
    forms: "النماذج",
    semantic: "HTML5",
    tables: "الجداول"
};

const cards = document.getElementById("cards");
const search = document.getElementById("search");
const filterButtons = document.querySelectorAll(".filter-btn");

let activeCategory = "all";

// عرض الدروس

function renderLessons() {

    const query = search.value.toLowerCase().trim();

    const filtered = lessons.filter(lesson => {

        const matchesCategory =
            activeCategory === "all" ||
            lesson.category === activeCategory;const matchesSearch =
            lesson.tag.toLowerCase().includes(query) ||
            lesson.name.toLowerCase().includes(query) ||
            lesson.description.toLowerCase().includes(query) ||
            lesson.code.toLowerCase().includes(query);

        return matchesCategory && matchesSearch;

    });

    cards.innerHTML = "";

    if (filtered.length === 0) {
        cards.innerHTML =
            '<div class="empty">لم يتم العثور على أي وسم.</div>';
        return;
    }

    filtered.forEach(lesson => {

        const card = document.createElement("article");
        card.className = "card";

        const image = document.createElement("div");
        image.className = "tag-image";

        const bar = document.createElement("div");
        bar.className = "window-bar";

        ["red", "yellow", "green"].forEach(color => {
            const dot = document.createElement("span");
            dot.className = "dot " + color;
            bar.appendChild(dot);
        });

        const windowContent = document.createElement("div");
        windowContent.className = "window-content";

        const bigTag = document.createElement("div");
        bigTag.className = "big-tag";
        bigTag.textContent = "<" + lesson.tag + ">";

        const caption = document.createElement("div");
        caption.className = "window-caption";
        caption.textContent = "HTML ELEMENT";

        windowContent.append(bigTag, caption);
        image.append(bar, windowContent);

        const content = document.createElement("div");
        content.className = "card-content";

        const top = document.createElement("div");
        top.className = "card-top";

        const heading = document.createElement("h3");
        heading.textContent = lesson.name;

        const category = document.createElement("span");
        category.className = "category";
        category.textContent = categoryNames[lesson.category];

        top.append(heading, category);

        const description = document.createElement("p");
        description.className = "description";
        description.textContent = lesson.description;

        const exampleTitle = document.createElement("div");
        exampleTitle.className = "example-title";
        exampleTitle.textContent = "Code Example";

        const code = document.createElement("pre");
        code.className = "code-box";
        code.textContent = lesson.code;

        const copy = document.createElement("button");
        copy.className = "copy-btn";
        copy.textContent = "نسخ الكود";

        copy.addEventListener("click", async () => {

            try {
                await navigator.clipboard.writeText(lesson.code);
                copy.textContent = "تم نسخ الكود ✓";
            } catch {
                copy.textContent = "تعذر النسخ";
            }

            setTimeout(() => {
                copy.textContent = "نسخ الكود";
            }, 1800);

        });

        content.append(
            top,
            description,
            exampleTitle,
            code,
            copy
        );

        card.append(image, content);
        cards.appendChild(card);

    });

}

// البحث

search.addEventListener("input", renderLessons);

// تصفية التصنيفات

filterButtons.forEach(button => {

    button.addEventListener("click", () => {

        filterButtons.forEach(btn =>
            btn.classList.remove("active")
        );

        button.classList.add("active");

        activeCategory = button.dataset.category;

        renderLessons();

    });

});

// تشغيل الصفحة

const params = new URLSearchParams(window.location.search);
const searchQuery = params.get("search");

if (searchQuery) {
    search.value = searchQuery;
}

renderLessons();
</script>
