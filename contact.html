<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | MA Academy</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7ff;
    color: #172554;
}

/* TOP SECTION */
.top-section {
    background: #e5e7eb;
    border-radius: 0 0 25px 25px;
    overflow: hidden;
}

/* HEADER */
header {
    padding: 25px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #1f2937;
    font-size: 27px;
    font-weight: bold;
}

.logo span {
    color: #2563eb;
}

/* HERO */
.hero {
    text-align: center;
    padding: 65px 20px 85px;
    color: #1f2937;
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.hero p {
    color: #64748b;
    font-size: 16px;
}

/* MAIN */
.container {
    max-width: 1000px;
    margin: 45px auto 60px;
    padding: 0 20px;
}

.section-title {
    font-size: 25px;
    margin-bottom: 25px;
    color: #172554;
}

/* CONTACT CARDS */
.contact-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 20px;
    margin-bottom: 55px;
}

.contact-card {
    background: white;
    padding: 28px 20px;
    border-radius: 15px;
    text-align: center;
    border: 1px solid #e5edff;
    text-decoration: none;
    color: #172554;
    box-shadow: 0 5px 20px rgba(0,0,0,0.04);
    transition: 0.3s;
}

.contact-card:hover {
    transform: translateY(-7px);
    border-color: #3b82f6;
    box-shadow: 0 10px 25px rgba(37,99,235,0.12);
}

/* SVG ICONS */
.contact-card .icon {
    width: 42px;
    height: 42px;
    margin: 0 auto 15px;
}

.contact-card .icon svg {
    width: 100%;
    height: 100%;
}

.instagram { color: #E1306C; }
.whatsapp { color: #25D366; }
.github { color: #181717; }
.gmail { color: #EA4335; }

.contact-card h3 {
    font-size: 19px;
    margin-bottom: 9px;
}

.contact-card p {
    color: #64748b;
    font-size: 13px;
}

/* CONTACT FORM */
.contact-form {
    background: white;
    padding: 35px;
    border-radius: 16px;
    border: 1px solid #e5edff;
    box-shadow: 0 5px 20px rgba(0,0,0,0.04);
}

.contact-form h2 {
    margin-bottom: 25px;
    font-size: 24px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    margin-bottom: 9px;
    font-size: 14px;
    font-weight: bold;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #dbe4f0;
    border-radius: 9px;
    outline: none;
    font-size: 14px;
    font-family: Arial;
    transition: 0.3s;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
}

.form-group textarea {
    height: 140px;
    resize: vertical;
}

.submit-btn {
    background: #2563eb;
    color: white;
    padding: 14px 30px;
    border: none;
    border-radius: 9px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.submit-btn:hover {
    background: #1d4ed8;
    transform: translateY(-2px);
}

/* FOOTER */
footer {
    background: #101d38;
    color: #cbd5e1;
    text-align: center;
    padding: 30px 15px;
    font-size: 13px;
}

footer a {
    color: #93c5fd;
    text-decoration: none;
    margin: 0 8px;
}

footer p {
    margin-top: 15px;
}

/* RESPONSIVE */
@media(max-width:600px) {
    .hero h1 {
        font-size: 30px;
    }

    header {
        padding: 20px;
    }

    .contact-form {
        padding: 22px;
    }
}
</style>
</head>

<!-- JAVASCRIPT -->
<script>
document.getElementById("contactForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const name = this.querySelector('input[type="text"]').value;
    const email = this.querySelector('input[type="email"]').value;
    const subject = this.querySelectorAll('input[type="text"]')[1].value;
    const message = this.querySelector('textarea').value;

    const body =
        "Hello MA Academy!\n\n" +
        "Name: " + name + "\n" +
        "Email: " + email + "\n" +
        "Subject: " + subject + "\n\n" +
        "Message:\n" + message;

    const whatsappURL =
        "https://wa.me/213553613038?text=" +
        encodeURIComponent(body);

    window.open(whatsappURL, "_blank");

});
</script>
