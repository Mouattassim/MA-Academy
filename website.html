<!DOCTYPE html>

.input{width:500px;height:60px;border: 1px solid  rgb(6, 84, 219);border-radius:50px;outline: none;}
.butoonn{width:120px;height: 64px;border: none;border-radius: 40px;background-color: rgb(6, 84, 219);transform: translateX(-70px);color: white;font-size:25px;}
body{background-color: white;color: black;transition: 0.5s;}
.dark{background-color: #222;color: white;}
</style>

</head>
<body class="body">

</div>
