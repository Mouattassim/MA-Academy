<style>
.navbar{display: flex;justify-content: space-between;align-items: center;max-width:100%;background-color:blue;position: fixed;margin:0;padding: 0;width: 100%;border-radius: 0px 0px 20px 20px;top: 0;left: 0;z-index: 1000;}
.logo{width:20%;;margin-right:50px;margin-left: 0 auto;}
.body{margin: 0;}
.h11{text-align: center;transform: translateY(10px);font-family:'Montserrat',sans-serif;width:100%;font-size:80px;border: none;outline: none;color: white;}
.pp{width:100%;font-size: 40px;transform: translateY(100px);text-align: center;font-family: 'Poppins',sans-serif;}

.button{width:130px;height:72px;border-radius:40px;border: none;transform: translateY(-7px);margin-right:0 auto;margin-left:-80px;font-size: 20px;background-color: red;color: white;}
.button:hover{background-color: rgb(139, 5, 5);}
.h111{font-family:'Cairo',sans-serif;font-weight:800;font-size: 100px;width:100%;text-align: center;transform: translateY(150px);}
.h3{font-family:'Cairo',sans-serif;font-weight: 300;font-size: 70px;width:100%;text-align: center;transform: translateY(150px);}
.divblue{background-color: blue;}
.body{background-color:white;}
.divblue1{background-color: blue;}
.html{width:700px;border: 1px solid #e0e0e0;padding:20px 10px 50px 10px;border-radius: 40px;background-color:#e0e0e0;justify-content: center;margin: 0 auto;}
.wave-container {
    position: relative;
    width: 100%;
    height: 300px;
    overflow: hidden;
    background:blue;
}

.waves {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200%;
    height: 50%;
}


.wave1 {
    fill: rgba(255,255,255,0.5);
    animation: moveWave 10s linear infinite;
}


.wave2 {
    fill: white;
    animation: moveWave 15s linear infinite;
    border-bottom: none;
}


@keyframes moveWave {

    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-50%);
    }

}

.wave-container{height:700px;width:100%;border: none;outline: none;border-bottom: none;}
.parent{width: 100%;margin: 0;padding: 0;background: blue;overflow: hidden;}
.navbar{width:100%;height:180px;background: blue;}
.wave-container{width:100%;height:600px;background: blue;margin-bottom: -2px;border-bottom: none;}
.text{text-align: center;}
.btnn{display:block;margin-left: auto;margin-right: auto;height:70px;width:180px;font-size:40px;font-family:'Oswald',sans-serif;border: none;background-color:#fd3a04;border-radius:30px;color: white;}
.btnn:hover{background-color: #af2f0b;}
.h1{text-align: center;font-family:'Montserrat',sans-serif;font-size:100px;color:#6e6206;}


</style>
